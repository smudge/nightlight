[package]
name = "nightlight"
version = "1.2.0"
authors = ["smudge <nathan@ngriffith.com>"]
edition = "2024"
categories = ["command-line-utilities", "os::macos-apis", "os::linux-apis"]
description = "A CLI for configuring 'Night Shift' on macOS (and night light on Linux) 🌕🌖🌗🌘🌑"
repository = "https://github.com/smudge/nightlight"
readme = "README.md"
license = "MIT"

[features] # required to fix unexpected `cfg` condition value
cargo-clippy = []

[dependencies]
serde_json = "1"
time = "0.2.27" # v0.3.41 is available

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
objc-foundation = "0.1.1"
